<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Signup</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='css/signup.css') }}">
    </head>
    <body>
        <div class="divider"></div>
        <div class="signupbox">
            <h1>Signup by entering your email!</h1>

            <!-- Signup form. Sends user-entered value to the signup route for validation. If valid sends to emailcode page-->
            <form method="post" action="/signup" class="useremailinput">
                <div>
                    <input type="text" name="emailtype" placeholder="Email here..." value="">
                    <input type="submit" name="confirmemail" value="Confirm">
                </div>
            </form>
            <div class="divider">
                <a href="{{ url_for('login') }}">Back</a>
            </div>

            <!-- Displays error messages -->
            {% if errormessage %}
                <div class="textalert">
                    <p style="background-color: rgb(75, 74, 0); color: #fad429;">{{ errormessage }}</p>
                </div>
            {% endif %}

        </div>
    </body>
</html>
